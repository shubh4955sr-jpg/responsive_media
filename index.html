<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>hero page responsive</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="header flex-row">

    <div id="logo">Logo</div>

    <nav class="navbar">
      <ul class="nav-list" data-nav></ul>
    </nav>


    <div class="right-section flex-row">

      <div id="username">Username</div>


      <button id="menu-btn" class="btn-reset">
        ☰
      </button>


      <div class="mobile-menu">

        <ul class="nav-list" data-nav></ul>

      </div>

    </div>

  </div>


  <div class="container-center">

    <div id="section1" class="flex-col">

      <h1 class="container-element">
        Revitalize Your Clothes with
        Expert <span>Laundry Services!</span>
      </h1>

      <p class="container-element">
        From premium dry cleaning to swift wash and fold,
        we deliver care and convenience. Schedule a pickup
        and rediscover the freshness of your clothes today!
      </p>

      <button id="button" class="btn-reset">
        Book a Service today
      </button>

    </div>

    <div id="section2" class="flex-center">

      <img
        src="image.webp"
        alt="laundry-image"
        id="image"
      />

    </div>

  </div>

  <script src="nav.js"></script>

</body>

</html>
